name: check monthly summary

on:
  pull_request:
    branches:
      - dev

jobs:
  check_summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get changed monthly entries
        id: changed_files
        run: |
          # PRで追加・変更された月記のみを対象にする（削除されたものは除く）
          CHANGED_FILES=$(git diff --name-only --diff-filter=d \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            | grep '^src/entries/monthly-.*\.md$' || true)
          echo "files=$(echo $CHANGED_FILES | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Check summary is filled in
        run: npm run check-monthly-summary -- ${{ steps.changed_files.outputs.files }}
